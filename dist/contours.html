<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="description" content="Generative contour drawings — an offline tool for topographic, biomorphic and architectural line art.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contours">
<title>Contours — generative topographic drawings</title>
<style>
/* ==========================================================================
   Contours — interface styles
   Mobile first. Phone portrait is the base case; wider viewports move the
   controls from a bottom sheet into a fixed side panel.
   ========================================================================== */

:root {
  /* Interface palette. The ARTWORK's own paper/ink live in js/render.js —
     they are a print decision, not a theme decision, so they are kept apart. */
  --ui-bg: #ffffff;          /* panels, bars, popovers */
  --ui-bg-2: #f3f1ec;        /* recessed surfaces and the area around the sheet */
  --ui-fg: #16161a;          /* primary text */
  --ui-on-fg: #faf8f4;       /* text sitting on a --ui-fg fill */
  --ui-fg-active: #33333a;   /* pressed state of a --ui-fg fill */
  --ui-line: #e0ddd5;
  --ui-line-strong: #cdc9bf;
  --ui-dim: #6f6b62;
  --chip-bg: rgba(255, 255, 255, 0.92);
  --overlay-bg: rgba(22, 22, 26, 0.86);   /* hint + toast */
  --overlay-fg: #ffffff;
  --scrim: rgba(0, 0, 0, .05);
  --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, .1);
  --shadow-pop: 0 12px 34px rgba(0, 0, 0, .18);
  --shadow-thumb: 0 1px 4px rgba(0, 0, 0, .28);
  --radius: 12px;
  --tap: 44px;                       /* minimum touch target */
  --topbar-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --sheet-h: 46vh;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
}

/*
 * Dark palette. Declared twice on purpose:
 *   · the media query covers "Auto", the default, where nothing is stamped on
 *     <html> — guarded so an explicit Light choice still wins on a dark OS
 *   · the attribute rule covers an explicit Dark choice on a light OS
 * Only the tokens change; no component rule below knows which theme is active.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #1b1b20;
    --ui-bg-2: #101013;
    --ui-fg: #ecebe6;
    --ui-on-fg: #16161a;
    --ui-fg-active: #cfcdc6;
    --ui-line: #2e2e35;
    --ui-line-strong: #44444e;
    --ui-dim: #9b968c;
    --chip-bg: rgba(27, 27, 32, 0.92);
    --overlay-bg: rgba(236, 235, 230, 0.92);
    --overlay-fg: #16161a;
    --scrim: rgba(0, 0, 0, .2);
    --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, .5);
    --shadow-pop: 0 12px 34px rgba(0, 0, 0, .55);
    --shadow-thumb: 0 1px 4px rgba(0, 0, 0, .6);
  }
}

:root[data-theme="dark"] {
  --ui-bg: #1b1b20;
  --ui-bg-2: #101013;
  --ui-fg: #ecebe6;
  --ui-on-fg: #16161a;
  --ui-fg-active: #cfcdc6;
  --ui-line: #2e2e35;
  --ui-line-strong: #44444e;
  --ui-dim: #9b968c;
  --chip-bg: rgba(27, 27, 32, 0.92);
  --overlay-bg: rgba(236, 235, 230, 0.92);
  --overlay-fg: #16161a;
  --scrim: rgba(0, 0, 0, .2);
  --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, .5);
  --shadow-pop: 0 12px 34px rgba(0, 0, 0, .55);
  --shadow-thumb: 0 1px 4px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;                  /* no page scrolling, ever */
  overscroll-behavior: none;
  background: var(--ui-bg-2);
  color: var(--ui-fg);
  font-family: var(--font);
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body { position: fixed; inset: 0; width: 100%; }

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { touch-action: manipulation; }

/* ── app shell ─────────────────────────────────────────────────────────── */

#app {
  position: absolute;
  inset: 0;
  display: grid;
  /* minmax(0,1fr) — without it the side panel's content sets a minimum height
     and pushes the canvas row past the bottom of the screen */
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr);
}

/* ── top bar ───────────────────────────────────────────────────────────── */

#topbar {
  grid-row: 1;
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 6px calc(8px + var(--safe-r)) 6px calc(8px + var(--safe-l));
  padding-top: calc(6px + var(--safe-t));
  background: var(--ui-bg);
  border-bottom: 1px solid var(--ui-line);
  z-index: 36;             /* above the scrim — the top bar never dims */
}

/* Buttons share the bar evenly and shrink their padding before their height,
   so every target stays at least 44px tall even on a 320px phone. */
#topbar .btn {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0 6px;
  font-size: clamp(12.5px, 3.4vw, 15px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#topbar .btn-more { flex: 0 1 auto; }

.btn {
  flex: 0 0 auto;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 10px;
  background: var(--ui-bg);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.1px;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.btn:active { background: var(--ui-bg-2); }
.btn[aria-expanded="true"] { background: var(--ui-bg-2); border-color: var(--ui-fg); }
.btn-primary { background: var(--ui-fg); color: var(--ui-on-fg); border-color: var(--ui-fg); }
.btn-primary:active { background: var(--ui-fg-active); }

/* ── canvas stage ──────────────────────────────────────────────────────── */

#stage {
  grid-row: 2;
  position: relative;
  overflow: hidden;
  background: var(--ui-bg-2);
  min-height: 0;
}

#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;                /* we handle all gestures ourselves */
  cursor: crosshair;
}

.overlay {
  position: absolute;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  pointer-events: none;
  z-index: 10;
}
.overlay > * { pointer-events: auto; }
.overlay-top { top: 8px; left: calc(8px + var(--safe-l)); right: 8px; }
.overlay-bottom {
  bottom: 8px;
  left: calc(8px + var(--safe-l));
  right: 8px;
  flex-wrap: wrap-reverse;
  align-items: flex-end;
}

.chip {
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 999px;
  background: var(--chip-bg);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.chip-action { min-height: var(--tap); padding: 0 16px; font-size: 14px; font-weight: 500; }
.chip-quiet { color: var(--ui-dim); cursor: default; }
.chip-key { color: var(--ui-dim); }
.chip-val { font-weight: 600; }
.chip:disabled { opacity: .4; cursor: default; }

.hint {
  position: absolute;
  left: 50%;
  bottom: 78px;
  max-width: calc(100% - 24px);
  white-space: normal;
  text-align: center;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--ui-line-strong);
  background: var(--overlay-bg);
  color: var(--overlay-fg);
  font-size: 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s ease;
  z-index: 12;
}
.hint.show { opacity: 1; }

/* ── bottom sheet ──────────────────────────────────────────────────────── */

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  height: calc(var(--sheet-h) + var(--safe-b));
  max-height: calc(100% - var(--topbar-h) - 40px);
  background: var(--ui-bg);
  border-top: 1px solid var(--ui-line);
  border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow-sheet);
  transform: translateY(calc(100% + 4px));
  transition: transform .26s cubic-bezier(.32, .72, 0, 1);
  padding-bottom: var(--safe-b);     /* iPhone home indicator */
}
.sheet.open { transform: translateY(0); }

.sheet-handle {
  flex: 0 0 auto;
  height: 26px;
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.sheet-handle span {
  display: block;
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--ui-line-strong);
}

.tabs {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 8px 6px;
  border-bottom: 1px solid var(--ui-line);
}

.tab {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ui-dim);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--ui-bg-2); color: var(--ui-fg); }

.sheet-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 10px 14px 20px;
}

.panel { display: none; }
.panel.active { display: block; }

/* ── sliders ───────────────────────────────────────────────────────────── */

.ctl { padding: 6px 0 10px; }

.ctl-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 30px;
}
.ctl-label { font-size: 14px; font-weight: 500; }
.ctl-sub { display: block; font-size: 11.5px; color: var(--ui-dim); font-weight: 400; margin-top: 1px; }

/* the numeric value doubles as a button that turns into a text field */
.ctl-val {
  min-width: 62px;
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid var(--ui-line);
  border-radius: 8px;
  background: var(--ui-bg-2);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  text-align: center;
  cursor: text;
}
input.ctl-val { -moz-appearance: textfield; }
input.ctl-val::-webkit-outer-spin-button,
input.ctl-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* generous vertical padding gives the thumb a 44px grab area
   without making the visible track fat */
.range-wrap { padding: 5px 0; }

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 34px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: var(--ui-line-strong);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  margin-top: -12px;
  border-radius: 50%;
  background: var(--ui-fg);
  border: 3px solid var(--ui-bg);
  box-shadow: var(--shadow-thumb);
}
input[type=range]::-moz-range-track {
  height: 4px;
  border-radius: 2px;
  background: var(--ui-line-strong);
}
input[type=range]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ui-fg);
  border: 3px solid var(--ui-bg);
}

/* ── segmented control ─────────────────────────────────────────────────── */

.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 10px;
  background: var(--ui-bg-2);
}
.seg button {
  flex: 1 1 0;
  min-height: 38px;
  border: 0;
  border-radius: 7px;
  background: none;
  font-size: 14px;
  cursor: pointer;
  color: var(--ui-dim);
}
.seg button[aria-pressed="true"] { background: var(--ui-bg); color: var(--ui-fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ── export panel ──────────────────────────────────────────────────────── */

.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: var(--tap);
  padding: 0 12px;
  border: 1px solid var(--ui-line);
  border-radius: 10px;
  background: var(--ui-bg);
  font-size: 14px;
  cursor: pointer;
}
.toggle input { width: 22px; height: 22px; accent-color: var(--ui-fg); }

.note { font-size: 12.5px; line-height: 1.5; color: var(--ui-dim); margin: 2px 0 0; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ui-dim); margin: 14px 0 4px; }

/* ── popovers, scrim, toast ────────────────────────────────────────────── */

/* Deliberately very light: the artwork has to stay readable while the sheet
   is open, since that is the whole point of tuning parameters. */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  z-index: 35;
}

/* Lift the canvas chips above the sheet so Fit / Undo stay reachable. */
body.sheet-open .overlay-bottom {
  transform: translateY(calc(-1 * (var(--sheet-h) + var(--safe-b))));
  transition: transform .26s cubic-bezier(.32, .72, 0, 1);
}
body.sheet-open .hint { display: none; }

.popover {
  position: fixed;
  z-index: 60;
  min-width: 230px;
  max-width: min(320px, calc(100vw - 20px));
  padding: 6px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 14px;
  background: var(--ui-bg);
  box-shadow: var(--shadow-pop);
}
.menu-item, .preset-item {
  display: block;
  width: 100%;
  min-height: var(--tap);
  padding: 8px 12px;
  border: 0;
  border-radius: 9px;
  background: none;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
}
.menu-item:active, .preset-item:active { background: var(--ui-bg-2); }
.preset-item strong { display: block; font-weight: 600; }
.preset-item small { display: block; color: var(--ui-dim); font-size: 12px; margin-top: 2px; line-height: 1.35; }
.preset-item[aria-current="true"] { background: var(--ui-bg-2); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  transform: translateX(-50%);
  z-index: 80;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--ui-line-strong);
  background: var(--overlay-bg);
  color: var(--overlay-fg);
  font-size: 13.5px;
  max-width: calc(100vw - 32px);
  text-align: center;
}

/* ==========================================================================
   Wide layout — landscape phone, tablet and desktop.
   Canvas on the left, controls docked on the right.
   ========================================================================== */

@media (min-width: 760px), (orientation: landscape) and (min-width: 620px) {
  #app {
    grid-template-columns: minmax(0, 1fr) 336px;
    grid-template-rows: auto minmax(0, 1fr);
  }
  #topbar { grid-column: 1 / -1; }
  /* plenty of room here — no need to stretch the buttons across the bar */
  #topbar .btn { flex: 0 0 auto; padding: 0 14px; font-size: 15px; }
  body.sheet-open .overlay-bottom { transform: none; }
  #stage { grid-column: 1; grid-row: 2; }

  .sheet {
    position: relative;
    grid-column: 2;
    grid-row: 2;
    height: auto;
    max-height: none;
    transform: none;
    border-top: 0;
    border-left: 1px solid var(--ui-line);
    border-radius: 0;
    box-shadow: none;
    padding-bottom: 0;
    transition: none;
  }
  .sheet.collapsed { display: none; }
  .sheet-handle { display: none; }
  .sheet-body { padding-bottom: calc(20px + var(--safe-b)); }
  .scrim { display: none !important; }
  #btnSettings { display: none; }        /* panel is always there */
  .overlay-bottom { bottom: calc(8px + var(--safe-b)); }
}

@media (min-width: 1100px) {
  #app { grid-template-columns: 1fr 380px; }
}

/* Landscape phones are short — give the canvas as much height as possible. */
@media (orientation: landscape) and (max-height: 460px) {
  :root { --topbar-h: 48px; --tap: 42px; }
  .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }
  #topbar { padding-top: 4px; padding-bottom: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  .sheet, .hint { transition: none; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ── top bar: essential actions only ───────────────────────────── -->
  <header id="topbar">
    <button id="btnGenerate" class="btn btn-primary">Generate</button>
    <button id="btnRandom" class="btn">Random</button>
    <button id="btnPresets" class="btn" aria-haspopup="true" aria-expanded="false">Presets</button>
    <button id="btnSettings" class="btn" aria-expanded="false">Settings</button>
    <button id="btnMore" class="btn btn-more" aria-haspopup="true" aria-expanded="false">More</button>
  </header>

  <!-- ── canvas stage ──────────────────────────────────────────────── -->
  <main id="stage">
    <canvas id="canvas"></canvas>

    <div id="overlayTop" class="overlay overlay-top">
      <button id="seedChip" class="chip" title="Tap to type a seed">
        <span class="chip-key">seed</span><span id="seedValue" class="chip-val">—</span>
      </button>
      <span id="presetChip" class="chip chip-quiet">Topographic</span>
    </div>

    <div id="overlayBottom" class="overlay overlay-bottom">
      <button id="btnFit" class="chip chip-action">Fit to screen</button>
      <button id="btnUndoQuick" class="chip chip-action" disabled>Undo</button>
      <span id="statusChip" class="chip chip-quiet" hidden></span>
    </div>

    <div id="hint" class="hint">Tap to add a seed · drag to move · long-press to remove</div>
  </main>

  <!-- ── controls: bottom sheet on phones, side panel when wide ────── -->
  <section id="sheet" class="sheet" aria-label="Settings">
    <button id="sheetHandle" class="sheet-handle" aria-label="Collapse settings"><span></span></button>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="scrim" class="scrim" hidden></div>

  <!-- ── popovers ──────────────────────────────────────────────────── -->
  <div id="presetMenu" class="popover" hidden role="menu" aria-label="Presets"></div>
  <div id="moreMenu" class="popover" hidden role="menu" aria-label="More actions">
    <button class="menu-item" data-act="undo">Undo last generation</button>
    <button class="menu-item" data-act="reset">Reset everything</button>
    <button class="menu-item" data-act="fit">Fit to screen</button>
    <button class="menu-item" data-act="theme" id="miTheme">Switch to dark mode</button>
    <button class="menu-item" data-act="png">Download PNG</button>
    <button class="menu-item" data-act="svg">Download SVG</button>
    <button class="menu-item" data-act="share">Share…</button>
    <button class="menu-item" data-act="fullscreen">Fullscreen</button>
    <button class="menu-item" data-act="seedcopy">Copy settings link</button>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script>
/* ---- js/rng.js ---- */
/*
 * rng.js — deterministic pseudo random numbers.
 *
 * Everything in the generator is driven by one integer seed so that the same
 * seed always reproduces exactly the same drawing. We never call Math.random()
 * inside the generation pipeline.
 */
(function (root) {
  'use strict';
  var GA = (root.GA = root.GA || {});

  /* mulberry32 — small, fast, good enough distribution for graphics work. */
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function RNG(seed) {
    this._n = mulberry32(seed | 0);
  }

  /* uniform [0,1) */
  RNG.prototype.next = function () {
    return this._n();
  };
  /* uniform [a,b) */
  RNG.prototype.f = function (a, b) {
    return a + (b - a) * this._n();
  };
  /* integer [a,b] inclusive */
  RNG.prototype.i = function (a, b) {
    return a + Math.floor(this._n() * (b - a + 1));
  };
  /* true with probability p */
  RNG.prototype.chance = function (p) {
    return this._n() < p;
  };
  RNG.prototype.pick = function (arr) {
    return arr[Math.floor(this._n() * arr.length) % arr.length];
  };
  /* roughly normal, mean 0 stddev 1 (sum of 3 uniforms) */
  RNG.prototype.gauss = function () {
    return (this._n() + this._n() + this._n() - 1.5) * 1.4142;
  };
  /* a fresh independent stream, derived deterministically */
  RNG.prototype.fork = function (salt) {
    return new RNG((Math.floor(this._n() * 0xffffffff) ^ (salt | 0)) | 0);
  };

  GA.RNG = RNG;
  GA.randomSeed = function () {
    return (Math.floor(Math.random() * 0xffffff) + 1) | 0;
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* ---- js/noise.js ---- */
/*
 * noise.js — seeded 2D gradient (Perlin) noise + fractal Brownian motion.
 *
 * Used for two things only:
 *   1. domain warping   — bends the whole distance field so contours flow
 *   2. additive jitter  — makes the spacing between contours slightly uneven
 *
 * Both are deliberately low frequency: high frequency noise reads as "glitch",
 * which is exactly the look we are avoiding.
 */
(function (root) {
  'use strict';

      });
    }).catch(function (err) {
      GA.ui.toast(GA.exporters.explainSaveError(err, 'png'), 3600);
    });
  }

  function shareArt() {
    if (!navigator.share) { GA.ui.toast('Sharing is not available in this browser'); return; }
    var col = exportColors();
    var c = GA.exporters.toCanvas(art, {
      scale: Math.min(flags.pngScale, 3), background: true, plotter: flags.plotter,
      paper: col.paper, ink: col.ink
    });
    GA.exporters.canvasToBlob(c).then(function (blob) {
      GA.exporters.shareFile(blob, fileBase() + '.png', 'Contour study — seed ' + state.seed)
        .catch(function () {
          return navigator.share({ title: 'Contours', text: 'Seed ' + state.seed, url: settingsURL() });
        })
        .catch(function () { GA.ui.toast('Sharing cancelled'); });
    });
  }

  function settingsURL() {
    var payload = { s: state.seed, p: state.presetId, v: state.params };
    return location.origin + location.pathname + '#' + encodeURIComponent(JSON.stringify(payload));
  }

  /* ---------------------------------------------------------------------- */
  /* Persistence                                                             */
  /* ---------------------------------------------------------------------- */

  var saveTimer = 0;
  function saveNow() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        seed: state.seed, params: state.params, seeds: state.seeds,
        secondary: state.secondary, artW: state.artW, artH: state.artH,
        presetId: state.presetId, flags: flags
      }));
    } catch (e) { /* private mode / quota — not fatal */ }
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  // mobile Safari can discard the page without warning — flush on the way out
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveNow();
  });

  function load() {
    // a settings link always wins over stored state
    if (location.hash.length > 2) {
      try {
        var h = JSON.parse(decodeURIComponent(location.hash.slice(1)));
        if (h && h.v) {
          state.seed = h.s | 0;
          state.presetId = h.p || 'custom';
          Object.keys(GA.DEFAULTS).forEach(function (k) {
            if (h.v[k] !== undefined) state.params[k] = h.v[k];
          });
          return 'hash';
        }
      } catch (e) { /* malformed link, fall through */ }
    }
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var s = JSON.parse(raw);
      if (!s || !s.params) return false;
      state.seed = s.seed;
      Object.keys(GA.DEFAULTS).forEach(function (k) {
        if (s.params[k] !== undefined) state.params[k] = s.params[k];
      });
      state.seeds = s.seeds || [];
      state.secondary = s.secondary || null;
      state.artW = s.artW || BASE;
      state.artH = s.artH || BASE;
      state.presetId = s.presetId || 'custom';
      if (s.flags) Object.keys(flags).forEach(function (k) {
        if (s.flags[k] !== undefined) flags[k] = s.flags[k];
      });
      return state.seeds.length ? 'store' : false;
    } catch (e) { return false; }
  }

  /* ---------------------------------------------------------------------- */
  /* Canvas interaction                                                      */
  /* ---------------------------------------------------------------------- */

  var pointers = new Map();
  var dragIndex = -1;
  var pressStart = null;
  var longPressTimer = 0;
  var moved = false;
  var panning = false;
  var pinch = null;

  function toWorld(cx, cy) {
    return { x: (cx - view.x) / view.k, y: (cy - view.y) / view.k };
  }

  function localPoint(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function hitSeed(px, py) {
    var best = -1, bestD = 26; // screen px
    for (var i = 0; i < state.seeds.length; i++) {
      var s = state.seeds[i];
      var d = Math.hypot(s.x * view.k + view.x - px, s.y * view.k + view.y - py);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function nearestSeed(px, py) {
    var best = -1, bestD = Infinity;
    for (var i = 0; i < state.seeds.length; i++) {
      var s = state.seeds[i];
      var d = Math.hypot(s.x * view.k + view.x - px, s.y * view.k + view.y - py);
      if (d < bestD) { bestD = d; best = i; }
    }
    return { index: best, dist: bestD };
  }

  function addSeedAt(wx, wy) {
    pushUndo();
    var pool = [];
    state.seeds.forEach(function (s) { if (pool.indexOf(s.group) === -1) pool.push(s.group); });
    var rng = new GA.RNG((state.seed ^ (state.seeds.length * 2654435761) ^ (Date.now() & 0xffff)) | 0);
    state.seeds.push(GA.generator.makeSeed(rng, wx, wy, state.params, pool));
    state.secondary = null;
    animRequest = { origin: { x: wx, y: wy } };   // ripple out from the new seed
    request('full');
  }

  function removeSeed(i) {
    if (i < 0 || i >= state.seeds.length) return;
    if (state.seeds.length <= 1) { GA.ui.toast('Keep at least one seed'); return; }
    pushUndo();
    state.seeds.splice(i, 1);
    state.secondary = null;
    request('full');
  }

  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    var p = localPoint(e);
    pointers.set(e.pointerId, p);

    if (pointers.size === 2) {
      // second finger down — switch to pinch/pan, cancel any seed interaction
      clearTimeout(longPressTimer);
      dragIndex = -1;
      panning = false;
      var pts = Array.from(pointers.values());
      pinch = {
        d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        cx: (pts[0].x + pts[1].x) / 2,
        cy: (pts[0].y + pts[1].y) / 2,
        k: view.k, vx: view.x, vy: view.y
      };
      beginGesture();
      return;
    }
    if (pointers.size > 2) return;

    moved = false;
    pressStart = p;

    var hit = hitSeed(p.x, p.y);
    if (e.shiftKey && e.pointerType === 'mouse') {
      var n = nearestSeed(p.x, p.y);
      if (n.index >= 0 && n.dist < 140) removeSeed(n.index);
      pressStart = null;
      return;
    }
    if (hit >= 0) {
      dragIndex = hit;
      pushUndo();
      // long press on a seed removes it
      longPressTimer = setTimeout(function () {
        if (!moved && dragIndex >= 0) {
          var i = dragIndex;
          dragIndex = -1;
          dropUndo();                    // the drag snapshot is redundant here
          removeSeed(i);
          if (navigator.vibrate) navigator.vibrate(12);
          GA.ui.toast('Seed removed');
        }
      }, 520);
      draw();
    } else {
      panning = true;
      beginGesture();
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    var p = localPoint(e);
    pointers.set(e.pointerId, p);

    if (pinch && pointers.size >= 2) {
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var cx = (pts[0].x + pts[1].x) / 2;
      var cy = (pts[0].y + pts[1].y) / 2;
      var s = Math.max(0.05, Math.min(40, d / Math.max(1, pinch.d)));
      view.k = pinch.k * s;
      // keep the pinch midpoint anchored, and follow two-finger dragging
      view.x = cx - (pinch.cx - pinch.vx) * s;
      view.y = cy - (pinch.cy - pinch.vy) * s;
      userMovedView = true;
      draw();
      return;
    }

    if (pressStart && Math.hypot(p.x - pressStart.x, p.y - pressStart.y) > 7) {
      moved = true;
      clearTimeout(longPressTimer);
    }

    if (dragIndex >= 0 && moved) {
      var w = toWorld(p.x, p.y);
      state.seeds[dragIndex].x = w.x;
      state.seeds[dragIndex].y = w.y;
      request('preview');
      return;
    }

    if (panning && moved) {
      view.x += p.x - pressStart.x;
      view.y += p.y - pressStart.y;
      pressStart = p;
      userMovedView = true;
      draw();
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    var p = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    clearTimeout(longPressTimer);

    if (pinch) {
      if (pointers.size < 2) { pinch = null; endGesture(); }
      pressStart = null;
      dragIndex = -1;
      panning = false;
      return;
    }

    if (dragIndex >= 0) {
      if (moved) request('full'); else dropUndo();
      dragIndex = -1;
      draw();
      pressStart = null;
      return;
    }

    if (panning) {
      panning = false;
      endGesture();
      if (!moved && pressStart) {
        var w = toWorld(p.x, p.y);
        if (w.x > -40 && w.y > -40 && w.x < state.artW + 40 && w.y < state.artH + 40) {
          addSeedAt(w.x, w.y);
        }
      }
    }
    pressStart = null;
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var p = localPoint(e);
    var f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
    var k2 = Math.max(0.05, Math.min(40, view.k * f));
    view.x = p.x - (p.x - view.x) * (k2 / view.k);
    view.y = p.y - (p.y - view.y) * (k2 / view.k);
    view.k = k2;
    userMovedView = true;
    draw();
  }, { passive: false });

  // iOS Safari page-level pinch zoom
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  /* ---------------------------------------------------------------------- */
  /* Chrome wiring                                                           */
  /* ---------------------------------------------------------------------- */

  var wideQuery = window.matchMedia('(min-width: 760px), (orientation: landscape) and (min-width: 620px)');
  function isWide() { return wideQuery.matches; }

  function openSheet(open) {
    if (isWide()) {
      sheet.classList.toggle('collapsed', !open);
      return;
    }
    sheet.classList.toggle('open', open);
    document.body.classList.toggle('sheet-open', open);
    scrim.hidden = !open;
    document.getElementById('btnSettings').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  document.getElementById('btnSettings').addEventListener('click', function () {
    openSheet(!sheet.classList.contains('open'));
  });
  document.getElementById('sheetHandle').addEventListener('click', function () { openSheet(false); });
  scrim.addEventListener('click', function () { openSheet(false); closeMenus(); });

  document.getElementById('btnGenerate').addEventListener('click', function () { generate(false); });
  document.getElementById('btnRandom').addEventListener('click', function () { generate(true); });
  document.getElementById('btnFit').addEventListener('click', function () { fitToScreen(); });
  document.getElementById('btnUndoQuick').addEventListener('click', undo);

  /* popovers -------------------------------------------------------------- */

  var presetMenu = document.getElementById('presetMenu');
  var moreMenu = document.getElementById('moreMenu');

  GA.PRESETS.forEach(function (p) {
    var b = GA.ui.el('button', 'preset-item');
    b.appendChild(GA.ui.el('strong', null, p.name));
    b.appendChild(GA.ui.el('small', null, p.note));
    b.addEventListener('click', function () { closeMenus(); applyPreset(p.id); });
    b.dataset.preset = p.id;
    presetMenu.appendChild(b);
  });

  function closeMenus() {
    presetMenu.hidden = true;
    moreMenu.hidden = true;
    document.getElementById('btnPresets').setAttribute('aria-expanded', 'false');
    document.getElementById('btnMore').setAttribute('aria-expanded', 'false');
  }

  function toggleMenu(menu, btn) {
    var wasOpen = !menu.hidden;
    closeMenus();
    if (wasOpen) return;
    document.getElementById('miTheme').textContent =
      isDark() ? 'Switch to light mode' : 'Switch to dark mode';
    Array.prototype.forEach.call(presetMenu.children, function (c) {
      c.setAttribute('aria-current', c.dataset.preset === state.presetId ? 'true' : 'false');
    });
    GA.ui.openPopover(menu, btn);
    btn.setAttribute('aria-expanded', 'true');
  }

  document.getElementById('btnPresets').addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMenu(presetMenu, e.currentTarget);
  });
  document.getElementById('btnMore').addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMenu(moreMenu, e.currentTarget);
  });
  document.addEventListener('pointerdown', function (e) {
    if (!presetMenu.hidden && !presetMenu.contains(e.target)) closeMenus();
    else if (!moreMenu.hidden && !moreMenu.contains(e.target)) closeMenus();
  }, true);

  moreMenu.addEventListener('click', function (e) {
    var act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    closeMenus();
    if (act === 'undo') undo();
    else if (act === 'reset') resetAll();
    else if (act === 'fit') fitToScreen();
    else if (act === 'theme') toggleTheme();
    else if (act === 'png') exportPNG();
    else if (act === 'svg') exportSVG();
    else if (act === 'share') shareArt();
    else if (act === 'fullscreen') toggleFullscreen();
    else if (act === 'seedcopy') copySettings();
  });

  /* From the More menu: flip to the opposite of what is showing, and make it
     an explicit choice rather than leaving it on Auto. */
  function toggleTheme() {
    flags.theme = isDark() ? 'light' : 'dark';
    applyTheme();
    if (uiRef) uiRef.setTheme(flags.theme);
    save();
  }

  /* Fullscreen is refused outright on iPhone Safari and inside a sandboxed
     iframe, so every path here has to degrade to a message rather than an
     unhandled rejection. */
  function toggleFullscreen() {
    var d = document.documentElement;
    var noFS = function () {
      GA.ui.toast('Fullscreen is not available here — on iOS use Share → Add to Home Screen');
    };
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var req = d.requestFullscreen || d.webkitRequestFullscreen;
        if (!req) return noFS();
        var r = req.call(d);
        if (r && r.catch) r.catch(noFS);
      } else {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) {
          var e = exit.call(document);
          if (e && e.catch) e.catch(function () {});
        }
      }
    } catch (err) {
      noFS();
    }
  }

  function copySettings() {
    var url = settingsURL();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        GA.ui.toast('Settings link copied');
      }, function () { GA.ui.toast('Could not copy'); });
    } else {
      GA.ui.toast('Clipboard unavailable');
    }
  }

  /* seed chip — tap to type an exact seed ---------------------------------- */

  document.getElementById('seedChip').addEventListener('click', function () {
    var chip = document.getElementById('seedChip');
    if (chip.querySelector('input')) return;
    var input = document.createElement('input');
    input.type = 'number';
    input.className = 'ctl-val';
    input.style.width = '110px';
    input.value = state.seed;
    var old = chip.innerHTML;
    chip.innerHTML = '';
    chip.appendChild(input);
    input.focus();
    input.select();
    var finish = function (apply) {
      var v = parseInt(input.value, 10);
      chip.innerHTML = old;
      updateSeedChip();
      if (apply && !isNaN(v)) {
        pushUndo();
        state.seed = v | 0;
        reseed();
        updateSeedChip();
        request('full');
      }
    };
    input.addEventListener('blur', function () { finish(true); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
  });

  /* keyboard shortcuts (desktop) ------------------------------------------ */

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'g') generate(false);
    else if (e.key === 'r') generate(true);
    else if (e.key === 'f') fitToScreen();
    else if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); }
  });

  /* ---------------------------------------------------------------------- */
  /* Boot                                                                    */
  /* ---------------------------------------------------------------------- */

  uiRef = GA.ui.build({
    body: document.getElementById('sheetBody'),
    tabsEl: document.getElementById('tabs'),
    get: function (k) { return state.params[k]; },
    onParam: onParam,
    flags: flags,
    onFlag: function (k, v) {
      flags[k] = v;
      if (k === 'theme') applyTheme();
      else if (k === 'animate' && !v) { cancelAnim(); draw(); }
      else if (k === 'plotter' || k === 'showSeeds' || k === 'invertArt') draw();
      save();
    },
    onExport: function (kind) {
      if (kind === 'png') exportPNG();
      else if (kind === 'svg') exportSVG();
      else shareArt();
    }
  });

  var restored = load();
  applyTheme();
  resize();
  // a restored drawing keeps the artboard it was made on, otherwise the stored
  // seed positions would no longer match the composition
  if (!restored || !state.seeds.length) {
    syncArtboard();
    reseed();
  }
  GA.generator.resolveSeeds(state.seeds, state.params);
  fitToScreen(false);
  syncUI();
  animRequest = { origin: null };
  request('full');
  if (isWide()) sheet.classList.remove('collapsed');

  window.addEventListener('resize', function () {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(resize, 120);
  });
  window.addEventListener('orientationchange', function () {
    userMovedView = false;
    setTimeout(resize, 220);
  });

  // first-run hint
  if (!localStorage.getItem(STORE_KEY + '.seen')) {
    var hint = document.getElementById('hint');
    setTimeout(function () { hint.classList.add('show'); }, 700);
    setTimeout(function () { hint.classList.remove('show'); }, 5200);
    try { localStorage.setItem(STORE_KEY + '.seen', '1'); } catch (e) {}
  }

  // PWA — only meaningful over http(s); opening index.html from disk still works
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  root.CONTOURS = {
    state: state, view: view, flags: flags,
    draw: draw, request: request,
    _anim: function () { return anim; },
    _addSeed: function (x, y) { addSeedAt(x, y); },
    setTheme: function (v) { flags.theme = v; applyTheme(); if (uiRef) uiRef.setTheme(v); save(); },
    setFlag: function (k, v) { flags[k] = v; if (k === 'theme') applyTheme(); else draw(); save(); },
    get art() { return art; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
